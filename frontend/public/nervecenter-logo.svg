<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">NerveCenter</title>
  <desc id="desc">NerveCenter mark: a blue-to-violet loop with a sky-blue folded ribbon.</desc>
  <defs>
    <linearGradient id="ring" x1="8%" y1="8%" x2="94%" y2="92%">
      <stop offset="0%" stop-color="#2FA8FF"/>
      <stop offset="42%" stop-color="#2563EB"/>
      <stop offset="72%" stop-color="#3D42E8"/>
      <stop offset="100%" stop-color="#5A2DD8"/>
    </linearGradient>
    <linearGradient id="ringSheen" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="46%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fold" x1="8%" y1="8%" x2="92%" y2="92%">
      <stop offset="0%" stop-color="#BFE4FF"/>
      <stop offset="52%" stop-color="#8CC8FF"/>
      <stop offset="100%" stop-color="#5B9DF7"/>
    </linearGradient>
    <linearGradient id="foldSheen" x1="12%" y1="4%" x2="90%" y2="94%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1F55D8" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="softShadow" x="-24%" y="-24%" width="148%" height="158%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#172554" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172554" flood-opacity="0.10"/>
    </filter>
  </defs>

