server {
    listen ${NGINX_LISTEN_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Messages carry their files as base64 JSON: up to 25 MB of files is about 36 MB of body
    # (ATTACHMENT_REQUEST_BYTES in backend/src/tasks/attachments.mjs). nginx's 1 MB default refused them.
    client_max_body_size 40m;

    # Support both a reverse proxy that strips ${PUBLIC_BASE_PATH} and direct
    # access to the container port with the prefix still present.
    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This container is the temporary trusted demo gateway. Always
        # overwrite caller-provided identity headers; never forward them.
        proxy_set_header X-User-Id "${OPS_DEFAULT_USER_ID}";
        proxy_set_header X-User-Name "${OPS_DEFAULT_USER_NAME}";
        proxy_set_header X-Ops-Trusted-Identity "${OPS_TRUSTED_IDENTITY_TOKEN}";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://${BACKEND_UPSTREAM}/health;
    }

    # Platform ingress owns shared auth paths. A request reaching this
    # application container indicates that the ingress route is misconfigured.
    location ^~ /apps/api/v1/auth/ {
        return 404;
    }

    location ${PUBLIC_BASE_PATH}/api/ {
        proxy_pass http://${BACKEND_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "${OPS_DEFAULT_USER_ID}";
        proxy_set_header X-User-Name "${OPS_DEFAULT_USER_NAME}";
        proxy_set_header X-Ops-Trusted-Identity "${OPS_TRUSTED_IDENTITY_TOKEN}";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = ${PUBLIC_BASE_PATH}/health {
        proxy_pass http://${BACKEND_UPSTREAM}/health;
    }

    location = ${PUBLIC_BASE_PATH} {
        return 301 ${PUBLIC_BASE_PATH}/;
    }

    location ${PUBLIC_BASE_PATH}/ {
        rewrite ^${PUBLIC_BASE_PATH}/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
